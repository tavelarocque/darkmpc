[package]
name = "darkmpc-server"
description = "darkmpc servers as separate processes over mutually authenticated TLS, with a simulated network model."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
darkmpc-mpc = { path = "../mpc" }
darkmpc-auction = { path = "../auction" }
darkmpc-reference.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.14.10"
getrandom = "0.3"
